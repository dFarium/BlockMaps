plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "blockmaps" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        autoExportClient {
            inherit client
            name "Auto Export Client"
            vmArg "-Dblockmaps.auto_exit=true"
            
            def worldName = project.findProperty("world") ?: "BlockMaps-${project.minecraft_version}"
            vmArg "-Dblockmaps.world_name=${worldName}"
            programArg "--quickPlaySingleplayer"
            programArg worldName
        }
    }
}

// Client assets are required for texture extraction.
fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.x ships unobfuscated; dependencies do not need remapping.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

// Minecraft 26.x requires Java 25.
def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    withSourcesJar()
}
